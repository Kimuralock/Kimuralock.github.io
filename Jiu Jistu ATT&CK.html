<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiu Jitsu ATT&CK 3.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            color: #cccccc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* 技术导航条 */
        .course-nav {
            display: none;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #333;
            font-size: 0.95em;
            flex-wrap: wrap;
        }
        .course-nav a {
            color: #c9a87b;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .course-nav a:hover {
            color: #e0c89a;
        }
        .nav-divider {
            color: #444;
        }
        .nav-current {
            color: #888;
            font-weight: 500;
        }
        .nav-dropdown {
            position: relative;
            display: inline-block;
        }
        .nav-dropbtn {
            background: none;
            border: 1px solid #444;
            color: #ccc;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: inherit;
        }
        .nav-dropbtn:hover {
            border-color: #888;
        }
        .nav-dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            min-width: 160px;
            z-index: 10;
            margin-top: 4px;
        }
        .nav-dropdown-content.show {
            display: block;
        }
        .nav-dropdown-content a {
            display: block;
            padding: 8px 14px;
            color: #ccc;
            text-decoration: none;
            font-weight: 400;
            font-size: 0.9em;
            cursor: pointer;
        }
        .nav-dropdown-content a:hover {
            background: #333;
            color: #fff;
        }

        /* 主页样式 */
        h1 {
            font-size: 1.6em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .section {
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            background: #1e1e1e;
        }
        .section-header {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .section-header:hover {
            background: #252525;
        }
        .section-header .icon {
            font-size: 1.3em;
            margin-right: 10px;
            width: 28px;
            text-align: center;
        }
        .section-header .title {
            font-size: 1.1em;
            font-weight: 600;
            flex: 1;
        }
        .section-header .arrow {
            color: #666;
            transition: transform 0.2s;
            font-size: 0.9em;
        }
        .section.open .section-header .arrow {
            transform: rotate(90deg);
        }
        .section-header .badge {
            font-size: 0.75em;
            color: #888;
            background: #2a2a2a;
            padding: 2px 10px;
            border-radius: 12px;
            margin-right: 10px;
        }
        .sub-list {
            display: none;
            border-top: 1px solid #2a2a2a;
            padding: 8px 16px 12px;
            background: #1a1a1a;
        }
        .section.open .sub-list {
            display: block;
        }
        .sub-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 6px;
            color: #ccc;
            text-decoration: none;
            transition: background 0.15s;
            margin: 2px 0;
            cursor: pointer;
        }
        .sub-item:hover {
            background: #252525;
            border-left: 2px solid #c9a87b;
            padding-left: 10px;
        }
        .sub-item .name {
            flex: 1;
        }
        .sub-item .progress {
            font-size: 0.8em;
            color: #666;
        }
        .sub-item.coming-soon {
            opacity: 0.5;
            cursor: default;
        }
        .sub-item.coming-soon:hover {
            background: transparent;
            border-left: none;
            padding-left: 12px;
        }

        /* 技术详情样式 */
        #course-detail {
            display: none;
        }
        #course-detail h2 {
            margin-top: 6px;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #333;
        }
        #course-detail h3 {
            margin-top: 22px;
            margin-bottom: 6px;
            color: #bbbbbb;
        }
        #course-detail table {
            border-collapse: collapse;
            width: 100%;
            color: #cccccc;
            margin: 10px 0;
        }
        #course-detail th,
        #course-detail td {
            border: 1px solid #555;
            padding: 8px 12px;
            text-align: left;
        }
        #course-detail th {
            background: #2a2a2a;
        }
        .sec-desc {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .sec-desc:hover {
            background: #252525;
        }
        .sec-desc.editing {
            background: #252525;
            cursor: text;
        }
        .sec-desc input {
            width: 100%;
            background: #252525;
            color: #ccc;
            border: 1px solid #555;
            padding: 4px 8px;
            font-size: 0.9em;
            border-radius: 4px;
            font-family: inherit;
        }
        .row {
            display: flex;
            align-items: center;
            margin: 4px 0;
            padding: 6px 6px;
            border-radius: 6px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .row:hover {
            background: #222;
        }
        .prof-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .prof-btn {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.78em;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #444;
            background: #1e1e1e;
            color: #777;
            transition: all 0.15s;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .prof-btn:hover {
            border-color: #888;
            color: #aaa;
        }
        .prof-btn.active.blue {
            background: #1a3a5c;
            border-color: #3a7cc3;
            color: #7ab8f5;
            box-shadow: 0 0 6px rgba(58, 124, 195, 0.3);
        }
        .prof-btn.active.purple {
            background: #2a1a3c;
            border-color: #7b3fb0;
            color: #c09af0;
            box-shadow: 0 0 6px rgba(123, 63, 176, 0.3);
        }
        .prof-btn.active.brown {
            background: #3c2a1a;
            border-color: #a06b3a;
            color: #e0b87a;
            box-shadow: 0 0 6px rgba(160, 107, 58, 0.3);
        }
        .prof-btn.active.black {
            background: #0f0f0f;
            border-color: #d4af37;
            color: #f0e6c8;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        .row-label {
            flex: 1;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 3px;
            transition: background 0.15s;
            min-width: 120px;
        }
        .row-label:hover {
            background: #2a2a2a;
        }
        .row-label input {
            width: 100%;
            background: #252525;
            color: #ccc;
            border: 1px solid #555;
            padding: 2px 6px;
            font-size: 1em;
            border-radius: 3px;
            font-family: inherit;
        }
        .del-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 1.1em;
            padding: 4px 8px;
            border-radius: 3px;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .del-btn:hover {
            color: #e05555;
            background: #2a1a1a;
        }
        .add-btn {
            background: none;
            border: 1px dashed #555;
            color: #888;
            cursor: pointer;
            padding: 5px 16px;
            border-radius: 4px;
            font-size: 0.9em;
            margin-top: 6px;
            margin-left: 6px;
            transition: all 0.15s;
        }
        .add-btn:hover {
            border-color: #c9a87b;
            color: #c9a87b;
        }
    </style>
</head>
<body>

    <nav class="course-nav" id="courseNav">
        <a onclick="goHome()">← 主页</a>
        <span class="nav-divider">|</span>
        <span class="nav-current" id="navCurrent">X 防守</span>
        <span class="nav-divider">|</span>
        <div class="nav-dropdown">
            <button class="nav-dropbtn" onclick="toggleDropdown(event)">其他技术 ▾</button>
            <div class="nav-dropdown-content" id="dropdownMenu">
                <a onclick="openCourse('xguard')">X 防守</a>
                <a onclick="openCourse('butterfly')">蝴蝶防守</a>
                <a onclick="openCourse('spider')">蜘蛛防守</a>
                <a onclick="goHome()">查看全部技术</a>
            </div>
        </div>
    </nav>

    <div id="home-view">
        <h1>🥋 Jiu Jitsu ATT&CK 3.0</h1>

        <div class="section" id="sec-takedowns">
            <div class="section-header" onclick="toggleSection('sec-takedowns')">
                <span class="icon">🤼</span><span class="title">摔法</span><span class="badge">待修行</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list"></div>
        </div>

        <div class="section" id="sec-passing">
            <div class="section-header" onclick="toggleSection('sec-passing')">
                <span class="icon">🚧</span><span class="title">过防</span><span class="badge">待修行</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list"></div>
        </div>

        <div class="section" id="sec-pinning">
            <div class="section-header" onclick="toggleSection('sec-pinning')">
                <span class="icon">📌</span><span class="title">压制</span><span class="badge">待修行</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list"></div>
        </div>

        <div class="section open" id="sec-guard">
            <div class="section-header" onclick="toggleSection('sec-guard')">
                <span class="icon">🛡️</span><span class="title">防守</span><span class="badge">1 项技术</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list">
                <div class="sub-item" onclick="openCourse('xguard')">
                    <span class="name">X 防守</span>
                    <span class="progress" id="prog-xguard">修行中...</span>
                </div>
                <div class="sub-item coming-soon"><span class="name">蝴蝶防守</span><span class="progress" id="prog-butterfly">待修行</span></div>
                <div class="sub-item coming-soon"><span class="name">蜘蛛防守</span><span class="progress" id="prog-spider">待修行</span></div>
            </div>
        </div>

        <div class="section" id="sec-submissions">
            <div class="section-header" onclick="toggleSection('sec-submissions')">
                <span class="icon">🔒</span><span class="title">降服</span><span class="badge">待修行</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list"></div>
        </div>
    </div>

    <div id="course-detail">
        <div id="course-content"></div>
    </div>

    <script>
        const homeView = document.getElementById('home-view');
        const courseDetail = document.getElementById('course-detail');
        const courseContent = document.getElementById('course-content');
        const courseNav = document.getElementById('courseNav');
        const navCurrent = document.getElementById('navCurrent');

        const courseNames = {
            'xguard': 'X 防守',
            'butterfly': '蝴蝶防守',
            'spider': '蜘蛛防守'
        };

        function openCourse(key) {
            homeView.style.display = 'none';
            courseDetail.style.display = 'block';
            courseNav.style.display = 'flex';
            navCurrent.textContent = courseNames[key] || key;
            if (key === 'xguard') renderXGuard();
        }

        function goHome() {
            homeView.style.display = 'block';
            courseDetail.style.display = 'none';
            courseNav.style.display = 'none';
            updateAllProgress();
        }

        function toggleSection(id) {
            document.getElementById(id).classList.toggle('open');
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.nav-dropdown')) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
        });

        function getProgress(storageKey) {
            const raw = localStorage.getItem(storageKey);
            if (!raw) return { total: 0, learned: 0 };
            try {
                const data = JSON.parse(raw);
                if (data && data.proficiency) {
                    let total = 0,
                        learned = 0;
                    for (const arr of Object.values(data.proficiency)) {
                        if (Array.isArray(arr)) {
                            arr.forEach(v => {
                                if (v !== undefined && v !== null && v !== '') {
                                    total++;
                                    if (['blue', 'purple', 'brown', 'black'].includes(v)) learned++;
                                }
                            });
                        }
                    }
                    return { total, learned };
                }
            } catch (e) {}
            return { total: 0, learned: 0 };
        }

        function updateAllProgress() {
    const courses = [
        { elId: 'prog-xguard', storageKey: 'xguard_student_data_v3' },
        { elId: 'prog-butterfly', storageKey: 'butterfly_student_data_v3' },
        { elId: 'prog-spider', storageKey: 'spider_student_data_v3' }
    ];
    courses.forEach(c => {
        const el = document.getElementById(c.elId);
        if (!el) return;
        el.textContent = ''; // 清空进度文字，不再显示计数
    });
}

        const defaultItems = {
            basic: ['什么是X guard，X这个字母从何而来'],
            types: [],
            entry: ['对手站姿，我拿到胫骨对胫骨', '对手交叉腿时直接打入后X防守', '从被压制逃脱回防到X防守',
                '如何 pull 拉入X防守'
            ],
            sweep: ['前', '后', '左', '右'],
            submission: ['腿锁', '手臂及肩锁', '绞技'],
            transition: [
                '对手降低重心并维持了非常好的支撑时，转换到侍者防守',
                '对手降低重心并维持了非常好的支撑时，转换到半防蝎尾',
                '对方成功干扰或者拆除我的腿勾时，转换到K防守',
                '后X防守和进攻拿背的关系'
            ],
            counter: ['绕腿', '背步', '进入菠萝乱战'],
            videos: [] // 新增的视频板块
        };

        const defaultDescs = {
            'types-desc': '取决于我们的手把和脚把，同时取决于我们头在对手身体前侧还是身体后侧亦有区分，不同的X防守也有不同的特性与控制方式，帮助学员学习全部类型及控制要点以及不同类型X防守之间的转换',
            'entry-desc': '任何情况下只要对手双腿之间有空间能让我抢到内线，我都有机会打入X防守，课程只介绍几种情况，但远不止此',
            'sweep-desc': '我们为了不生造词或者用大量尚未统一的技术名词淹没大家，无论是扫技还是破势，我们永远只以方向区分',
            'submission-desc': '同样我们为了效率仅采用攻击部位来做区分',
            'transition-desc': '我们当然可以从X防守转换到我们想要的位置，或者是对方做出很好的反应我们被迫转到一些位置，我们只需要知道有哪些比较好的转换以及如何做，本课程只介绍几种情况，同样远不止此',
            'counter-desc': '知己知彼方能百战百胜，对手不是第一天练柔术的菜鸟，面对我们的X防守，世界级选手会怎么做？以及如果我们面对X防守该如何应对。',
            'videos-desc': '以下推荐视频均来自网络，仅供学习参考。学员可自行添加、删除视频链接，并使用熟练度标记学习进度。'
        };

        const profLevels = [
            { key: 'blue', label: '了解', color: 'blue' },
            { key: 'purple', label: '熟悉', color: 'purple' },
            { key: 'brown', label: '掌握', color: 'brown' },
            { key: 'black', label: '精通', color: 'black' }
        ];

        function loadXGuardData() {
            const raw = localStorage.getItem('xguard_student_data_v3');
            if (raw) {
                try { return JSON.parse(raw); } catch (e) {}
            }
            return null;
        }

        function saveXGuardData(data) {
            localStorage.setItem('xguard_student_data_v3', JSON.stringify(data));
        }

        function getInitialXGuardData() {
            const saved = loadXGuardData();
            if (saved) return saved;
            const data = { items: {}, descs: {}, proficiency: {} };
            for (const [key, arr] of Object.entries(defaultItems)) {
                data.items[key] = [...arr];
            }
            for (const [key, val] of Object.entries(defaultDescs)) {
                data.descs[key] = val;
            }
            return data;
        }

        let xguardData = getInitialXGuardData();

        function persistXGuard() {
            saveXGuardData(xguardData);
        }

        function renderXGuard() {
            let html = '';
            html += '<h2>X Guard 基础</h2>';
            html += renderSection('basic', false);

            html += '<h3>X guard 类型与控制要点</h3>';
            html += renderSection('types', true, 'types-desc');

            html += `<table>
                <thead><tr><th>头的位置</th><th>脚把方式</th><th>近侧脚在上</th><th>远侧脚在上</th></tr></thead>
                <tbody>
                    <tr><td rowspan="2"><strong>头在前侧</strong></td><td>圈脚</td><td>X 防守</td><td>逆X防守</td></tr>
                    <tr><td>勺把（扛肩）</td><td>肩扛X防守</td><td>肩扛逆X防守</td></tr>
                    <tr><td rowspan="2"><strong>头在后侧</strong></td><td>圈脚</td><td>后X防守</td><td>后逆X防守</td></tr>
                    <tr><td>勺把（扛肩）</td><td>后肩扛X防守</td><td>后肩扛逆X防守</td></tr>
                </tbody>
            </table>`;

            html += '<h3>X 防守的打入</h3>';
            html += renderSection('entry', true, 'entry-desc');

            html += '<h3>X 防守的扫技</h3>';
            html += renderSection('sweep', true, 'sweep-desc');

            html += '<h3>X 防守的降服进攻</h3>';
            html += renderSection('submission', true, 'submission-desc');

            html += '<h3>X 防守的转换</h3>';
            html += renderSection('transition', true, 'transition-desc');

            html += '<h3>X 防守的针对性过防</h3>';
            html += renderSection('counter', true, 'counter-desc');

            html += '<h3>推荐视频教程</h3>';
            html += renderSection('videos', true, 'videos-desc');

            courseContent.innerHTML = html;
        }

        function renderSection(key, hasDesc, descKey) {
            let html = '';
            if (hasDesc && descKey) {
                html +=
                    `<div class="sec-desc" data-desc-key="${descKey}" onclick="editDesc(this, '${descKey}')">${xguardData.descs[descKey] || ''}</div>`;
            }
            const items = xguardData.items[key] || [];
            items.forEach((text, index) => {
                html += '<div class="row">';
                html += '<div class="prof-group">';
                const currentProf = (xguardData.proficiency[key] && xguardData.proficiency[key][index]) || '';
                profLevels.forEach(level => {
                    const activeClass = currentProf === level.key ? ` active ${level.color}` : '';
                    html +=
                        `<button class="prof-btn${activeClass}" onclick="setProf('${key}',${index},'${level.key}')">${level.label}</button>`;
                });
                html += '</div>';
                html +=
                    `<span class="row-label" onclick="editLabel(this, '${key}', ${index})">${escapeHtml(text)}</span>`;
                html += `<button class="del-btn" onclick="deleteItem('${key}', ${index})">✕</button>`;
                html += '</div>';
            });
            html += `<button class="add-btn" onclick="addItem('${key}')">+ 添加</button>`;
            return html;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        window.editDesc = function(el, descKey) {
            if (el.classList.contains('editing')) return;
            el.classList.add('editing');
            const input = document.createElement('input');
            input.value = xguardData.descs[descKey] || '';
            el.textContent = '';
            el.appendChild(input);
            input.focus();
            const save = () => {
                xguardData.descs[descKey] = input.value;
                persistXGuard();
                el.classList.remove('editing');
                el.textContent = xguardData.descs[descKey] || '';
            };
            input.addEventListener('blur', save);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
        };

        window.setProf = function(key, index, levelKey) {
            if (!xguardData.proficiency[key]) xguardData.proficiency[key] = [];
            if (xguardData.proficiency[key][index] === levelKey) {
                xguardData.proficiency[key][index] = '';
            } else {
                xguardData.proficiency[key][index] = levelKey;
            }
            persistXGuard();
            renderXGuard();
        };

        window.editLabel = function(el, key, index) {
            const input = document.createElement('input');
            input.value = xguardData.items[key][index];
            const finish = () => {
                xguardData.items[key][index] = input.value;
                persistXGuard();
                renderXGuard();
            };
            input.addEventListener('blur', finish);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(); });
            el.textContent = '';
            el.appendChild(input);
            input.focus();
        };

        window.deleteItem = function(key, index) {
            xguardData.items[key].splice(index, 1);
            if (xguardData.proficiency[key]) xguardData.proficiency[key].splice(index, 1);
            persistXGuard();
            renderXGuard();
        };

        window.addItem = function(key) {
            xguardData.items[key].push('');
            if (!xguardData.proficiency[key]) xguardData.proficiency[key] = [];
            xguardData.proficiency[key].push('');
            persistXGuard();
            renderXGuard();
        };

        updateAllProgress();
    </script>
</body>
</html>
