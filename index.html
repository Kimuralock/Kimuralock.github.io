<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiu Jitsu ATT&CK 3.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a1a;
            color: #cccccc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* 技术导航条 */
        .course-nav {
            display: none;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid #333;
            font-size: 0.95em;
            flex-wrap: wrap;
        }
        .course-nav a {
            color: #c9a87b;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .course-nav a:hover {
            color: #e0c89a;
        }
        .nav-divider {
            color: #444;
        }
        .nav-current {
            color: #888;
            font-weight: 500;
        }
        .nav-dropdown {
            position: relative;
            display: inline-block;
        }
        .nav-dropbtn {
            background: none;
            border: 1px solid #444;
            color: #ccc;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
            font-family: inherit;
        }
        .nav-dropbtn:hover {
            border-color: #888;
        }
        .nav-dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            min-width: 160px;
            z-index: 10;
            margin-top: 4px;
        }
        .nav-dropdown-content.show {
            display: block;
        }
        .nav-dropdown-content a {
            display: block;
            padding: 8px 14px;
            color: #ccc;
            text-decoration: none;
            font-weight: 400;
            font-size: 0.9em;
            cursor: pointer;
        }
        .nav-dropdown-content a:hover {
            background: #333;
            color: #fff;
        }

        /* 主页样式 */
        h1 {
            font-size: 1.6em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .section {
            margin-bottom: 12px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            background: #1e1e1e;
        }
        .section-header {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .section-header:hover {
            background: #252525;
        }
        .section-header .icon {
            font-size: 1.3em;
            margin-right: 10px;
            width: 28px;
            text-align: center;
        }
        .section-header .title {
            font-size: 1.1em;
            font-weight: 600;
            flex: 1;
        }
        .section-header .arrow {
            color: #666;
            transition: transform 0.2s;
            font-size: 0.9em;
        }
        .section.open .section-header .arrow {
            transform: rotate(90deg);
        }
        .section-header .badge {
            font-size: 0.75em;
            color: #888;
            background: #2a2a2a;
            padding: 2px 10px;
            border-radius: 12px;
            margin-right: 10px;
        }
        .sub-list {
            display: none;
            border-top: 1px solid #2a2a2a;
            padding: 8px 16px 12px;
            background: #1a1a1a;
        }
        .section.open .sub-list {
            display: block;
        }
        .sub-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 6px;
            color: #ccc;
            text-decoration: none;
            transition: background 0.15s;
            margin: 2px 0;
            cursor: pointer;
        }
        .sub-item:hover {
            background: #252525;
            border-left: 2px solid #c9a87b;
            padding-left: 10px;
        }
        .sub-item .name {
            flex: 1;
        }
        .sub-item .progress {
            font-size: 0.8em;
            color: #666;
        }
        .sub-item.coming-soon {
            opacity: 0.5;
            cursor: default;
        }
        .sub-item.coming-soon:hover {
            background: transparent;
            border-left: none;
            padding-left: 12px;
        }

        /* 技术详情样式 */
        #course-detail {
            display: none;
        }
        #course-detail h2 {
            margin-top: 6px;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid #333;
        }
        #course-detail h3 {
            margin-top: 22px;
            margin-bottom: 6px;
            color: #bbbbbb;
        }
        #course-detail table {
            border-collapse: collapse;
            width: 100%;
            color: #cccccc;
            margin: 10px 0;
        }
        #course-detail th,
        #course-detail td {
            border: 1px solid #555;
            padding: 8px 12px;
            text-align: left;
        }
        #course-detail th {
            background: #2a2a2a;
        }
        .sec-desc {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .sec-desc:hover {
            background: #252525;
        }
        .sec-desc.editing {
            background: #252525;
            cursor: text;
        }
        .sec-desc input {
            width: 100%;
            background: #252525;
            color: #ccc;
            border: 1px solid #555;
            padding: 4px 8px;
            font-size: 0.9em;
            border-radius: 4px;
            font-family: inherit;
        }
        .row {
            display: flex;
            align-items: center;
            margin: 4px 0;
            padding: 6px 6px;
            border-radius: 6px;
            gap: 10px;
            flex-wrap: wrap;
            flex-direction: row-reverse;
        }
        .row:hover {
            background: #222;
        }
        .prof-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        .prof-btn {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.78em;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #444;
            background: #1e1e1e;
            color: #777;
            transition: all 0.15s;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        .prof-btn:hover {
            border-color: #888;
            color: #aaa;
        }
        .prof-btn.active.blue {
            background: #1a3a5c;
            border-color: #3a7cc3;
            color: #7ab8f5;
            box-shadow: 0 0 6px rgba(58, 124, 195, 0.3);
        }
        .prof-btn.active.purple {
            background: #2a1a3c;
            border-color: #7b3fb0;
            color: #c09af0;
            box-shadow: 0 0 6px rgba(123, 63, 176, 0.3);
        }
        .prof-btn.active.brown {
            background: #3c2a1a;
            border-color: #a06b3a;
            color: #e0b87a;
            box-shadow: 0 0 6px rgba(160, 107, 58, 0.3);
        }
        .prof-btn.active.black {
            background: #0f0f0f;
            border-color: #d4af37;
            color: #f0e6c8;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }

        /* 总进度框颜色 */
        #summary.summary-blue, #nav-summary.summary-blue {
            background: #1a3a5c;
            border: 1px solid #3a7cc3;
            color: #7ab8f5;
            padding: 4px 12px;
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(58,124,195,0.3);
        }
        #summary.summary-purple, #nav-summary.summary-purple {
            background: #2a1a3c;
            border: 1px solid #7b3fb0;
            color: #c09af0;
            padding: 4px 12px;
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(123,63,176,0.3);
        }
        #summary.summary-brown, #nav-summary.summary-brown {
            background: #3c2a1a;
            border: 1px solid #a06b3a;
            color: #e0b87a;
            padding: 4px 12px;
            border-radius: 4px;
            box-shadow: 0 0 6px rgba(160,107,58,0.3);
        }
        #summary.summary-black, #nav-summary.summary-black {
            background: #0f0f0f;
            border: 1px solid #d4af37;
            color: #f0e6c8;
            padding: 4px 12px;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(212,175,55,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }

        .row-label {
            flex: 1;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 3px;
            transition: background 0.15s;
            min-width: 120px;
        }
        .row-label:hover {
            background: #2a2a2a;
        }
        .row-label input {
            width: 100%;
            background: #252525;
            color: #ccc;
            border: 1px solid #555;
            padding: 2px 6px;
            font-size: 1em;
            border-radius: 3px;
            font-family: inherit;
        }
        .del-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 1.1em;
            padding: 4px 8px;
            border-radius: 3px;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .del-btn:hover {
            color: #e05555;
            background: #2a1a1a;
        }
        .add-btn {
            background: none;
            border: 1px dashed #555;
            color: #888;
            cursor: pointer;
            padding: 5px 16px;
            border-radius: 4px;
            font-size: 0.9em;
            margin-top: 6px;
            margin-left: 6px;
            transition: all 0.15s;
        }
        .add-btn:hover {
            border-color: #c9a87b;
            color: #c9a87b;
        }
    </style>
</head>
<body>

    <nav class="course-nav" id="courseNav">
        <a onclick="goHome()">← 主页</a>
        <span class="nav-divider">|</span>
        <span class="nav-current" id="navCurrent">X 防守</span>
        <span id="nav-summary" style="margin-left: auto; font-weight: 600;"></span>
        <span class="nav-divider">|</span>
        <div class="nav-dropdown">
            <button class="nav-dropbtn" onclick="toggleDropdown(event)">其他技术 ▾</button>
            <div class="nav-dropdown-content" id="dropdownMenu">
                <a onclick="openCourse('xguard')">X 防守</a>
                <a onclick="openCourse('delariva')">德拉防守</a>
                <a onclick="openCourse('butterfly')">蝴蝶防守</a>
                <a onclick="openCourse('spider')">蜘蛛防守</a>
                <a onclick="goHome()">查看全部技术</a>
            </div>
        </div>
    </nav>

    <div id="home-view">
        <h1>🥋 Jiu Jitsu ATT&CK 3.0</h1>
        <div id="summary" style="text-align: center; font-size: 1.2em; margin-bottom: 20px;"></div>
        <div class="section" id="sec-takedowns">
            <div class="section-header" onclick="toggleSection('sec-takedowns')">
                <span class="icon">🤼</span><span class="title">摔法</span><span class="badge">待修行</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list"></div>
        </div>

        <div class="section" id="sec-passing">
            <div class="section-header" onclick="toggleSection('sec-passing')">
                <span class="icon">🚧</span><span class="title">过防</span><span class="badge">待修行</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list"></div>
        </div>

        <div class="section" id="sec-pinning">
            <div class="section-header" onclick="toggleSection('sec-pinning')">
                <span class="icon">📌</span><span class="title">压制</span><span class="badge">待修行</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list"></div>
        </div>

        <div class="section open" id="sec-guard">
            <div class="section-header" onclick="toggleSection('sec-guard')">
                <span class="icon">🛡️</span><span class="title">防守</span><span class="badge">2 项技术</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list">
                <div class="sub-item" onclick="openCourse('xguard')">
                    <span class="name">X 防守</span>
                    <span class="progress" id="prog-xguard">修行中...</span>
                </div>
                <div class="sub-item" onclick="openCourse('delariva')">
                    <span class="name">德拉防守</span>
                    <span class="progress" id="prog-delariva">修行中...</span>
                </div>
                <div class="sub-item coming-soon"><span class="name">蝴蝶防守</span><span class="progress" id="prog-butterfly">待修行</span></div>
                <div class="sub-item coming-soon"><span class="name">蜘蛛防守</span><span class="progress" id="prog-spider">待修行</span></div>
            </div>
        </div>

        <div class="section" id="sec-submissions">
            <div class="section-header" onclick="toggleSection('sec-submissions')">
                <span class="icon">🔒</span><span class="title">降服</span><span class="badge">待修行</span><span class="arrow">▶</span>
            </div>
            <div class="sub-list"></div>
        </div>
    </div>

    <div id="course-detail">
        <div id="course-content"></div>
    </div>

    <script>
        const homeView = document.getElementById('home-view');
        const courseDetail = document.getElementById('course-detail');
        const courseContent = document.getElementById('course-content');
        const courseNav = document.getElementById('courseNav');
        const navCurrent = document.getElementById('navCurrent');

        const courseNames = {
            'xguard': 'X 防守',
            'delariva': '德拉防守',
            'butterfly': '蝴蝶防守',
            'spider': '蜘蛛防守'
        };

        function openCourse(key) {
            homeView.style.display = 'none';
            courseDetail.style.display = 'block';
            courseNav.style.display = 'flex';
            navCurrent.textContent = courseNames[key] || key;
            if (key === 'xguard') renderXGuard();
            if (key === 'delariva') renderDeLaRivaGuard();
            updateTotalSummary();
        }

        function goHome() {
            homeView.style.display = 'block';
            courseDetail.style.display = 'none';
            courseNav.style.display = 'none';
            updateAllProgress();
        }

        function toggleSection(id) {
            document.getElementById(id).classList.toggle('open');
        }

        function toggleDropdown(e) {
            e.stopPropagation();
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.nav-dropdown')) {
                document.getElementById('dropdownMenu').classList.remove('show');
            }
        });

        function getProgress(storageKey) {
            const raw = localStorage.getItem(storageKey);
            if (!raw) return { total: 0, learned: 0 };
            try {
                const data = JSON.parse(raw);
                if (data && data.proficiency) {
                    let total = 0,
                        learned = 0;
                    for (const arr of Object.values(data.proficiency)) {
                        if (Array.isArray(arr)) {
                            arr.forEach(v => {
                                if (v !== undefined && v !== null && v !== '') {
                                    total++;
                                    if (['blue', 'purple', 'brown', 'black'].includes(v)) learned++;
                                }
                            });
                        }
                    }
                    return { total, learned };
                }
            } catch (e) {}
            return { total: 0, learned: 0 };
        }

        function updateAllProgress() {
            const courses = [
                { elId: 'prog-xguard', storageKey: 'xguard_student_data_v3' },
                { elId: 'prog-delariva', storageKey: 'delariva_student_data_v3' },
                { elId: 'prog-butterfly', storageKey: 'butterfly_student_data_v3' },
                { elId: 'prog-spider', storageKey: 'spider_student_data_v3' }
            ];
            courses.forEach(c => {
                const el = document.getElementById(c.elId);
                if (!el) return;
                el.textContent = '';
            });
            updateTotalSummary();
        }

        function updateTotalSummary() {
            let totalItems = 0;
            const colorCount = { blue: 0, purple: 0, brown: 0, black: 0 };

            const allKeys = [
                'xguard_student_data_v3',
                'delariva_student_data_v3',
                'butterfly_student_data_v3',
                'spider_student_data_v3'
            ];

            allKeys.forEach(key => {
                const raw = localStorage.getItem(key);
                if (!raw) return;
                try {
                    const data = JSON.parse(raw);
                    if (data && data.items && data.proficiency) {
                        for (const sectionKey of Object.keys(data.items)) {
                            const items = data.items[sectionKey];
                            const profs = data.proficiency[sectionKey] || [];
                            items.forEach((item, index) => {
                                if (item && item.trim() !== '') {
                                    totalItems++;
                                    const level = profs[index];
                                    if (level && ['blue', 'purple', 'brown', 'black'].includes(level)) {
                                        colorCount[level]++;
                                    }
                                }
                            });
                        }
                    }
                } catch (e) {}
            });

            const blackCoverage = totalItems > 0 ? colorCount.black / totalItems : 0;
            const brownCoverage = totalItems > 0 ? (colorCount.brown + colorCount.black) / totalItems : 0;
            const purpleCoverage = totalItems > 0 ? (colorCount.purple + colorCount.brown + colorCount.black) / totalItems : 0;
            const blueCoverage = totalItems > 0 ? (colorCount.blue + colorCount.purple + colorCount.brown + colorCount.black) / totalItems : 0;

            let activeColor = null;
            if (totalItems > 0) {
                if (blackCoverage >= 0.8) {
                    activeColor = 'black';
                } else if (brownCoverage >= 0.8) {
                    activeColor = 'brown';
                } else if (purpleCoverage >= 0.8) {
                    activeColor = 'purple';
                } else if (blueCoverage >= 0.8) {
                    activeColor = 'blue';
                }
            }

            const summaryEl = document.getElementById('summary');
            const navSummary = document.getElementById('nav-summary');
            let masteredItems = colorCount.blue + colorCount.purple + colorCount.brown + colorCount.black;
            const text = `总进度：${masteredItems} / ${totalItems}`;

            const allColors = ['blue', 'purple', 'brown', 'black'];
            [summaryEl, navSummary].forEach(el => {
                if (el) {
                    allColors.forEach(c => el.classList.remove(`summary-${c}`));
                }
            });

            if (activeColor) {
                [summaryEl, navSummary].forEach(el => {
                    if (el) el.classList.add(`summary-${activeColor}`);
                });
            }

            if (summaryEl) summaryEl.textContent = text;
            if (navSummary) navSummary.textContent = text;
        }

        // ==================== X 防守 ====================
        const defaultItemsX = {
            basic: ['什么是X guard，X这个字母从何而来'],
            types: [],
            entry: ['对手站姿，我拿到胫骨对胫骨', '对手交叉腿时直接打入后X防守', '从被压制逃脱回防到X防守',
                '如何 pull 拉入X防守'
            ],
            sweep: ['前', '后', '左', '右'],
            submission: ['腿锁', '手臂及肩锁', '绞技'],
            transition: [
                '对手降低重心并维持了非常好的支撑时，转换到侍者防守',
                '对手降低重心并维持了非常好的支撑时，转换到半防蝎尾',
                '对方成功干扰或者拆除我的腿勾时，转换到K防守',
                '后X防守和进攻拿背的关系'
            ],
            counter: ['绕腿', '背步', '进入菠萝乱战'],
            videos: []
        };

        const defaultDescsX = {
            'types-desc': '取决于我们的手把和脚把，同时取决于我们头在对手身体前侧还是身体后侧亦有区分，不同的X防守也有不同的特性与控制方式，帮助学员学习全部类型及控制要点以及不同类型X防守之间的转换',
            'entry-desc': '任何情况下只要对手双腿之间有空间能让我抢到内线，我都有机会打入X防守，课程只介绍几种情况，但远不止此',
            'sweep-desc': '我们为了不生造词或者用大量尚未统一的技术名词淹没大家，无论是扫技还是破势，我们永远只以方向区分',
            'submission-desc': '同样我们为了效率仅采用攻击部位来做区分',
            'transition-desc': '我们当然可以从X防守转换到我们想要的位置，或者是对方做出很好的反应我们被迫转到一些位置，我们只需要知道有哪些比较好的转换以及如何做，本课程只介绍几种情况，同样远不止此',
            'counter-desc': '知己知彼方能百战百胜，对手不是第一天练柔术的菜鸟，面对我们的X防守，世界级选手会怎么做？以及如果我们面对X防守该如何应对。',
            'videos-desc': '以下推荐视频均来自网络，仅供学习参考。学员可自行添加、删除视频链接，并使用熟练度标记学习进度。'
        };

        function loadCourseData(storageKey) {
            const raw = localStorage.getItem(storageKey);
            if (raw) {
                try { return JSON.parse(raw); } catch (e) {}
            }
            return null;
        }

        function saveCourseData(storageKey, data) {
            localStorage.setItem(storageKey, JSON.stringify(data));
        }

        function getInitialCourseData(storageKey, defaultItems, defaultDescs) {
        const saved = loadCourseData(storageKey);
         // 以默认配置为蓝本，如果已有存储数据，则会用存储数据覆盖
        const data = { items: {}, descs: {}, proficiency: {} };
    
        // 1. 先深拷贝默认配置，确保基础结构是完整的
        for (const [key, arr] of Object.entries(defaultItems)) {
        data.items[key] = [...arr];
        }
        for (const [key, val] of Object.entries(defaultDescs)) {
        data.descs[key] = val;
        }
    
        // 2. 如果有已存储的数据，就把它“安全地”合并进来
        if (saved) {
        // 合并说明文字（descs）：只更新我们已知的键，不能丢失默认新增的描述
        if (saved.descs) {
            for (const key of Object.keys(defaultDescs)) {
                if (saved.descs[key] !== undefined) {
                    data.descs[key] = saved.descs[key];
                }
            }
        }
        // 合并旧数据板块（items）：对于默认配置里已有的板块，用旧数据覆盖
        if (saved.items) {
            for (const key of Object.keys(defaultItems)) {
                if (saved.items[key]) {
                    data.items[key] = saved.items[key];
                }
            }
        }
        // 最后合并熟练度（proficiency）
        if (saved.proficiency) {
            data.proficiency = saved.proficiency;
        }
        
        // 【关键】确保熟练度里也有我们所有板块的key，防止后面出错
        for (const key of Object.keys(defaultItems)) {
            if (!data.proficiency[key]) {
                data.proficiency[key] = [];
            }
        }
        }
    
        return data;
        }

                '无道服德拉，以及进一步压迫膝盖的逆向收割reverse reap'
            ],
            entry: ['拉入德拉防守', '对手从封闭防守中站立时打入', '坐防打入德拉防守'],
            sweep: ['前', '后', '左', '右', 'forcing kneeling', 'reverse reap'],
            submission: ['腿锁', '臂锁及肩锁', '绞技'],
            transition: ['德拉与逆德拉', 'R防守', '转换到传统侍者防守', '进入菠萝', '进入矩阵'],
            counter: ['如何对抗破势','长步', '切膝', '压低对手德拉脚勾','如何对抗reaping','腿锁反击'],

        };

        const defaultDescsDeLaRiva = {

        let delarivaData = getInitialCourseData('delariva_student_data_v3', defaultItemsDeLaRiva, defaultDescsDeLaRiva);

        function persistDeLaRiva() {
            saveCourseData('delariva_student_data_v3', delarivaData);
        }

        function renderDeLaRivaGuard() {
            let html = '';
            html += '<h2>德拉防守</h2>';
            html += renderSection(delarivaData, 'basic', false);

            html += '<h3>类型与控制要点</h3>';
            html += renderSection(delarivaData, 'types', true, 'types-desc');

            html += '<h3>德拉防守的打入</h3>';
            html += renderSection(delarivaData, 'entry', true, 'entry-desc');

            html += '<h3>德拉防守的扫技</h3>';
            html += renderSection(delarivaData, 'sweep', true, 'sweep-desc');

            html += '<h3>德拉防守的降服进攻</h3>';
            html += renderSection(delarivaData, 'submission', true, 'submission-desc');

            html += '<h3>德拉防守的转换</h3>';
            html += renderSection(delarivaData, 'transition', true, 'transition-desc');

            html += '<h3>推荐视频教程</h3>';
            html += renderSection(delarivaData, 'videos', true, 'videos-desc');

            html += '<h3>德拉防守的针对性过防</h3>';
            html += renderSection(delarivaData, 'counter', true, 'counter-desc');

            courseContent.innerHTML = html;
        }

        function renderSection(courseData, key, hasDesc, descKey) {
            let html = '';
            if (hasDesc && descKey) {
                html +=
                    `<div class="sec-desc" data-desc-key="${descKey}" onclick="editDesc(this, '${descKey}')">${courseData.descs[descKey] || ''}</div>`;
            }
            const items = courseData.items[key] || [];
            items.forEach((text, index) => {
                html += '<div class="row">';
                html += '<div class="prof-group">';
                const currentProf = (courseData.proficiency[key] && courseData.proficiency[key][index]) || '';
                const profLevels = [
                    { key: 'blue', label: '了解', color: 'blue' },
                    { key: 'purple', label: '熟悉', color: 'purple' },
                    { key: 'brown', label: '掌握', color: 'brown' },
                    { key: 'black', label: '精通', color: 'black' }
                ];
                profLevels.forEach(level => {
                    const activeClass = currentProf === level.key ? ` active ${level.color}` : '';
                    html +=
                        `<button class="prof-btn${activeClass}" onclick="setCourseProf('${key}',${index},'${level.key}')">${level.label}</button>`;
                });
                html += '</div>';
                html += `<span class="row-label" onclick="editCourseLabel(this, '${key}', ${index})">${escapeHtml(text || '')}</span>`;
                html += `<button class="del-btn" onclick="deleteCourseItem('${key}', ${index})">✕</button>`;
                html += '</div>';
            });
            html += `<button class="add-btn" onclick="addCourseItem('${key}')">+ 添加</button>`;
            return html;
        }

        function getCurrentCourseData() {
            if (navCurrent.textContent === '德拉防守') return delarivaData;
            return xguardData;
        }

        function getCurrentPersist() {
            if (navCurrent.textContent === '德拉防守') return persistDeLaRiva;
            return persistXGuard;
        }

        function getCurrentRender() {
            if (navCurrent.textContent === '德拉防守') return renderDeLaRivaGuard;
            return renderXGuard;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        window.editDesc = function(el, descKey) {
            const courseData = getCurrentCourseData();
            const persist = getCurrentPersist();
            if (el.classList.contains('editing')) return;
            el.classList.add('editing');
            const input = document.createElement('input');
            input.value = courseData.descs[descKey] || '';
            el.textContent = '';
            el.appendChild(input);
            input.focus();
            const save = () => {
                courseData.descs[descKey] = input.value;
                persist();
                el.classList.remove('editing');
                el.textContent = courseData.descs[descKey] || '';
            };
            input.addEventListener('blur', save);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
        };

        window.setCourseProf = function(key, index, levelKey) {
            const courseData = getCurrentCourseData();
            const persist = getCurrentPersist();
            const render = getCurrentRender();
            if (!courseData.proficiency[key]) courseData.proficiency[key] = [];
            if (courseData.proficiency[key][index] === levelKey) {
                courseData.proficiency[key][index] = '';
            } else {
                courseData.proficiency[key][index] = levelKey;
            }
            persist();
            render();
            updateTotalSummary();
        };

        window.editCourseLabel = function(el, key, index) {
            const courseData = getCurrentCourseData();
            const persist = getCurrentPersist();
            const render = getCurrentRender();
            const input = document.createElement('input');
            input.value = courseData.items[key][index] || '';
            const finish = () => {
                courseData.items[key][index] = input.value;
                persist();
                render();
            };
            input.addEventListener('blur', finish);
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') finish(); });
            el.textContent = '';
            el.appendChild(input);
            input.focus();
        };

        window.deleteCourseItem = function(key, index) {
            const courseData = getCurrentCourseData();
            const persist = getCurrentPersist();
            const render = getCurrentRender();
            courseData.items[key].splice(index, 1);
            if (courseData.proficiency[key]) courseData.proficiency[key].splice(index, 1);
            persist();
            render();
        };

        window.addCourseItem = function(key) {
            const courseData = getCurrentCourseData();
            const persist = getCurrentPersist();
            const render = getCurrentRender();
            courseData.items[key].push('');
            if (!courseData.proficiency[key]) courseData.proficiency[key] = [];
            courseData.proficiency[key].push('');
            persist();
            render();
        };

        updateAllProgress();
        updateTotalSummary();
    </script>
